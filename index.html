<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090b10" />
  <meta name="description" content="Run the classic Turbo C3 development environment directly in a modern browser with js-dos." />
  <title>Turbo C3 Web Lab</title>

  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://v8.js-dos.com/latest/js-dos.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <p class="eyebrow">DOS DEVELOPMENT ENVIRONMENT</p>
      <h1>Turbo C3 Web Lab</h1>
      <p class="subtitle">Turbo C/C++ directly in your browser.</p>
    </header>

    <section class="toolbar" aria-label="Emulator controls">
      <div class="control-group">
        <button class="primary" id="startBtn" type="button">Start Turbo C3</button>
        <div class="runtime-controls" id="runtimeControls" hidden>
          <button id="restartBtn" type="button">Restart</button>
          <button id="pauseBtn" type="button">Pause</button>
          <button id="saveBtn" type="button">Save</button>
          <button id="fullscreenBtn" type="button">Fullscreen</button>
          <button class="danger" id="stopBtn" type="button">Stop</button>
        </div>
      </div>
      <button class="diagnostics-toggle" id="diagnosticsBtn" type="button" aria-expanded="false">Diagnostics</button>
    </section>

    <section class="emulator-frame" aria-label="Turbo C3 emulator">
      <div id="dos-container">
        <div class="empty-state" id="emptyState">
          <div class="terminal-mark" aria-hidden="true">C:\&gt;_</div>
          <span class="empty-label">Turbo C3</span>
        </div>
      </div>
    </section>

    <section class="diagnostics" id="diagnosticsPanel" hidden>
      <div class="panel-heading">
        <div>
          <p class="eyebrow">ENVIRONMENT CHECK</p>
          <h2>Diagnostics</h2>
        </div>
        <button class="ghost" id="runDiagnosticsBtn" type="button">Run checks</button>
      </div>

      <div class="checks" id="checks"></div>

      <div class="log-wrap">
        <div class="log-heading">
          <span>Runtime log</span>
          <button class="text-button" id="clearLogBtn" type="button">Clear</button>
        </div>
        <pre id="log" role="log" aria-live="polite"></pre>
      </div>
    </section>
  </main>
</body>
</html>
