<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#0b0d11" />
  <meta name="description" content="Run Turbo C/C++ and Borland graphics.h/BGI programs directly in your browser." />
  <title>Turbo C3 Web Lab</title>

  <link rel="icon" href="favicon.svg?v=1" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/js-dos@8.5.3/dist/js-dos.css" />
  <link rel="stylesheet" href="styles.css?v=layout9" />
  <script src="https://cdn.jsdelivr.net/npm/js-dos@8.5.3/dist/js-dos.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js" defer></script>
  <script src="app.js?v=20" defer></script>
</head>
<body>
  <main class="app">
    <header class="hero-header">
      <div class="brand-line">
        <img class="brand-icon" src="favicon.svg?v=1" alt="" aria-hidden="true" />
        <h1><span>Turbo</span> <span class="brand-accent">C3</span> <span>Web Lab</span></h1>
      </div>
    </header>

    <section class="stage" aria-label="Turbo C3 emulator">
      <div class="emulator-frame">
        <div id="dos-container">
          <div class="empty-state" id="emptyState">
            <div class="terminal-window">
              <div class="terminal-mark" aria-hidden="true">C:\&gt;_</div>
              <div class="empty-label">Turbo C3</div>
              <div class="empty-hint">Click Start to launch the IDE</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="launch-controls" aria-label="Emulator controls">
      <div class="control-group">
        <button class="primary" id="startBtn" type="button">Start Turbo C3</button>
        <div class="runtime-controls" id="runtimeControls" hidden>
          <button id="restartBtn" type="button">Restart</button>
          <button id="pauseBtn" type="button">Pause</button>
          <button id="fullscreenBtn" type="button">Fullscreen</button>
          <button class="danger" id="stopBtn" type="button">Stop</button>
        </div>
      </div>

      <button class="diagnostics-toggle" id="diagnosticsBtn" type="button" aria-expanded="false">Diagnostics</button>
    </div>

    <section class="diagnostics" id="diagnosticsPanel" hidden>
      <div class="panel-heading">
        <h2>Diagnostics</h2>
        <button class="ghost" id="runDiagnosticsBtn" type="button">Run checks</button>
      </div>

      <div class="checks" id="checks"></div>

      <div class="log-wrap">
        <div class="log-heading">
          <span>Runtime log</span>
          <button class="text-button" id="clearLogBtn" type="button">Clear</button>
        </div>
        <pre id="log" role="log" aria-live="polite"></pre>
      </div>
    </section>
  </main>
</body>
</html>
